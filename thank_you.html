<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - IRONCITY</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  body{
    background:#0a0a0a;
    color:#fff;
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .form-section{width:100%; max-width:500px;}
  .form-box{
    background:#151515;
    border:1px solid #222;
    border-radius:20px;
    padding:35px 30px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .check{
    width:80px; height:80px;
    background:#a6ff00;
    color:#000;
    font-size:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
    font-weight:800;
  }
  .form-title{
    font-family:'Anton', sans-serif;
    font-size:32px;
    letter-spacing:1px;
    line-height:1;
  }
  .form-subtitle{
    color:#888;
    margin-top:8px;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:2px;
  }
  #details{
    background:#000;
    padding:18px;
    border-radius:14px;
    border:1px solid #222;
    text-align:left;
    margin-top:25px;
    line-height:2;
    font-size:14px;
  }
  #details b{color:#a6ff00;}
  .btn-green{
    background:#a6ff00;
    color:#000;
    padding:14px;
    border-radius:12px;
    font-weight:800;
    text-decoration:none;
    display:block;
    text-transform:uppercase;
    margin-top:22px;
    letter-spacing:1px;
  }
  .btn-outline{
    border:1px solid #333;
    color:#fff;
    padding:13px;
    border-radius:12px;
    text-decoration:none;
    display:block;
    margin-top:12px;
    font-weight:600;
    transition:0.2s;
  }
  .btn-outline:hover{border-color:#a6ff00; color:#a6ff00;}
</style>
</head>
<body>

<div class="form-section">
  <div class="form-box">
    <div class="check">✓</div>
    <div class="form-title">REGISTRATION SUCCESSFUL!</div>
    <div class="form-subtitle">Welcome to IRONCITY family</div>
    
    <div id="details">Loading...</div>
    
    <a href="index.html" class="btn-green">Back to Home</a>
    <a href="https://maps.google.com/?q=Ogige+Main+Market+Nsukka" target="_blank" class="btn-outline">📍 Find Gym on Map</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('details').innerHTML = `
    <div>Name: <b>${params.get('name') || 'Member'}</b></div>
    <div>Plan: <b>${params.get('plan') || '-'}</b></div>
    <div>Expiry: <b>${params.get('expiry') || '-'}</b></div>
    <div style="margin-top:12px; font-size:12px; color:#666; line-height:1.5;">Please come to the gym with your phone number. An email has also been sent to you.</div>
  `;
</script>
</body>
</html>
