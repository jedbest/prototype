<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Already Active - IRONCITY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-section" style="margin-top:50px;">
  <div class="form-box" style="text-align:center;">
    <div style="font-size:50px;">⚠️</div>
    <div class="form-title" style="margin-top:10px; color:orange;">ALREADY ACTIVE</div>
    <div class="form-subtitle">You have an active plan already</div>
    <div style="background:#000; padding:15px; border-radius:12px; border:1px solid orange; text-align:left; margin-top:20px; line-height:1.8;" id="details">
      Loading...
    </div>
    <div style="margin-top:20px;">
      <a href="index.html" class="btn-green" style="display:block; text-align:center;">Back to Home</a>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('details').innerHTML = `
    <div>Phone: <b style="color:#a6ff00;">${params.get('phone')}</b></div>
    <div>Expiry: <b>${params.get('expiry')}</b></div>
    <div>Days Left: <b style="color:#a6ff00;">${params.get('days')} days remaining</b></div>
    <div style="margin-top:10px; font-size:13px; color:#aaa;">No need to pay again. Your plan is still active. Just come to gym.</div>
  `;
</script>
</body>
</html>
